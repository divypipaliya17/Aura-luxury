<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA COUTURE | Firebase Google Auth</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar">
        <div class="brand-logo">AURA</div>

        <!-- Auth Section -->
        <div id="auth-container">
            <!-- Sign In Button (When User is Logged Out) -->
            <button id="google-login-btn" class="login-btn">
                <i class="fa-brands fa-google"></i> Sign in with Google
            </button>

            <!-- Profile Info (When User is Logged In) -->
            <div id="user-profile" class="user-profile-box" style="display: none;">
                <img id="user-avatar" src="" alt="User Avatar" class="avatar-img">
                <span id="user-display-name">User Name</span>
                <button id="logout-btn" class="logout-btn">Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main style="padding: 50px; text-align: center;">
        <h1>Welcome to AURA</h1>
        <p id="welcome-status">Please login to access your account.</p>
    </main>

    <!-- App Logic Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
